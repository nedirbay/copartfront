<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Container -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)"/>
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="url(#accent-grad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Glowing Emblem Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accent-grad)" stroke-width="8" stroke-dasharray="16 12" opacity="0.6"/>

  <!-- Car Silhouette / Speed Line Emblem -->
  <path d="M120 310 C140 250, 200 230, 256 230 C312 230, 372 250, 392 310" fill="none" stroke="url(#accent-grad)" stroke-width="24" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Sleek Car Roof & Windshield Arc -->
  <path d="M180 235 C205 170, 307 170, 332 235 Z" fill="url(#accent-grad)" opacity="0.9"/>
  
  <!-- Golden Speed Accent / Badge C -->
  <path d="M140 330 L372 330" stroke="url(#gold-grad)" stroke-width="16" stroke-linecap="round" />

  <!-- Wheels Accent -->
  <circle cx="185" cy="330" r="32" fill="#0F172A" stroke="url(#gold-grad)" stroke-width="12"/>
  <circle cx="327" cy="330" r="32" fill="#0F172A" stroke="url(#gold-grad)" stroke-width="12"/>
  <circle cx="185" cy="330" r="10" fill="#3B82F6"/>
  <circle cx="327" cy="330" r="10" fill="#3B82F6"/>
</svg>